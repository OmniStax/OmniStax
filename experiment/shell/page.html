<!doctype html>
<html lang="en" data-book="{{BOOK}}" data-chapter="{{CHAPTER_DIR}}" data-section="{{SECTION}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
{{PREVNEXT}}
<meta name="omnia-root" content="{{ROOT}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ROOT}}assets/katex/katex.min.css">
<link rel="stylesheet" href="{{ROOT}}assets/shell.css">
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('omnia-theme');if(t==="dark"||t==="light")document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script type="application/ld+json">{{LDJSON}}</script>
</head>
<body>
<div class="shell">
<nav class="rail left" id="rail-left" aria-label="Documents and views"></nav>
<aside class="sidebar left" id="side-left"><div class="stack"></div><div class="grip" data-side="left"></div></aside>
<main class="docs" id="docs"></main>
<aside class="sidebar right" id="side-right"><div class="grip" data-side="right"></div><div class="stack"></div></aside>
<nav class="rail right" id="rail-right" aria-label="Views"></nav>
</div>

<div class="popover" id="settings" hidden>
  <div class="eyebrow">Settings</div>
  <label class="switch"><input type="checkbox" id="cc-toggle" checked> Color coding</label>
  <label class="switch theme"><input type="checkbox" id="theme-toggle"> Dark mode</label>
  <label class="switch"><input type="checkbox" id="anim-toggle" checked> Play animations</label>
  <button class="btn-sm" id="reset-layout" type="button">Reset layout</button>
  <small>Layout and settings are saved in this browser.</small>
</div>
<div class="popover picker" id="picker" hidden></div>

<div id="views" hidden>
<section class="view" data-view="concepts" data-title="Concept map" data-side="left">
  <div class="dag-legend"><span class="k-idea">idea</span><span class="k-result">result</span><span class="k-skill">skill</span><span class="ext">other section</span></div>
  <div class="dag" id="dag"></div>
  <div class="why" id="dag-why"><b>Hover a concept</b> to see why it matters. Click one to pin it and see where the text introduces, uses and tests it.</div>
</section>
<section class="view" data-view="contents" data-title="Contents" data-side="left">
  <div id="contents"></div>
</section>
<section class="view" data-view="formulas" data-title="Formulas" data-side="right">
  <div id="formulas"></div>
</section>
<section class="view" data-view="definitions" data-title="Definitions" data-side="right">
  <div id="definitions"></div>
  <div class="legend" id="legend"></div>
</section>
<section class="view" data-view="notes" data-title="Notes" data-side="right">
  <div class="blank">Your notes and highlights for this section will collect here.</div>
</section>
</div>

<div id="pool">
{{FRAGMENT}}
</div>


<script id="data-book" type="application/json">{{BOOK_JSON}}</script>
<script id="data-concepts" type="application/json">{{CONCEPTS_JSON}}</script>
<script id="data-formulas" type="application/json">{{FORMULAS_JSON}}</script>
<script src="{{ROOT}}assets/katex/katex.min.js"></script>
<script src="{{ROOT}}assets/katex/contrib/auto-render.min.js"></script>
<script src="{{ROOT}}assets/three.min.js"></script>
<script src="{{ROOT}}assets/figlib.js"></script>
<script src="figures.js"></script>
<script src="{{ROOT}}assets/shell.js"></script>
</body>
</html>
